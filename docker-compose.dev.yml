# 개발 오버라이드: backend --reload + Next.js Fast Refresh
# 사용법: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  server:
    volumes:
      - ./backend:/app/backend   # 코드 변경 실시간 반영
    environment:
      LOG_LEVEL: DEBUG
    command:
      ["/app/.venv/bin/python", "-m", "uvicorn", "backend.main:app",
       "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/backend"]
    healthcheck:
      start_period: 60s

  client:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      BACKEND_API_URL: http://server:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules          # node_modules는 컨테이너 내부 유지
      - /app/.next                 # 호스트와 컨테이너 빌드 캐시 분리
    depends_on:
      server:
        condition: service_started
