# CI — 외부 API·DB 없이 도는 검사만 실행한다 (기획: docs/Plan/PLAN_261117_CI.md)
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Unit tests
        run: >
          uv run python -m unittest -v
          backend.tests.test_spreadsheet
          backend.tests.test_table_chunking
          backend.tests.test_english_chunking
          backend.tests.test_judge_content
          backend.tests.test_eval_v2
          backend.tests.test_job_ids
          backend.tests.test_pdf_extract
          backend.tests.test_chunk_parallel

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Proxy tests
        run: npm run test:proxy

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
